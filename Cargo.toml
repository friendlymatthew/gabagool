
[package]
name = "gabagool"
description = "a snapshotable WASM interpreter"
version = "0.1.1"
edition = "2021"
authors = ["friendlymatthew"]
license = "Apache-2.0"

[dependencies]
libm = "0.2.16"

[build-dependencies]
object = "0.41.0"
wast = { version = "245.0.1", optional = true }

[features]
core-tests = ["wast"]
component-tests = []
jit = ["dep:libc"]

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
libc = { version = "0.2.191", optional = true, default-features = false }

[dev-dependencies]
insta = "1"
wat = "1"
criterion = "0.8.2"
wasmi = "1.0.9"

[[test]]
name = "core_tests"
path = "tests/core_tests.rs"
required-features = ["core-tests"]

[[bench]]
name = "programs"
harness = false
